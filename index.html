const MOD_NAME = Object.fromEntries(MODS.map(m=>[m.id,m.name]));

const TOPICS = [
/* ---------------- CT ---------------- */
{id:"ct-windows", mod:"ct", title:"CT windows & Hounsfield units", sum:"Window/level presets and the HU values of common tissues.", tags:["W/L","HU"], secs:[
  {h:"The HU scale and three common windows", hu:true},
  {h:"Window presets", table:{head:["Window","Width / Level","Use"], rows:[
    ["Brain","<code>W80 / L40</code>","Routine head CT"],
    ["Subdural","<code>W200 / L75</code>","Thin extra-axial collections against the skull"],
    ["Stroke","<code>W40 / L40</code>","Subtle gray–white loss in early infarct"],
    ["Bone","<code>W2000 / L500</code>","Fractures, skull base, spine"],
    ["Lung","<code>W1500 / L−600</code>","Parenchyma, nodules, airways"],
    ["Mediastinum","<code>W350 / L40</code>","Mediastinum, hila, pleura"],
    ["Abdomen soft tissue","<code>W400 / L40</code>","Routine abdomen and pelvis"],
    ["Liver","<code>W150 / L30</code>","Subtle hypodense liver lesions"],
    ["CTA","<code>W600 / L150</code>","Contrast-filled vessels"],
  ]}},
  {h:"Typical attenuation", table:{head:["Material","HU"], rows:[
    ["Air","−1000"],["Lung","−900 to −500"],["Fat","−120 to −60"],["Water / simple fluid","0 to 20"],
    ["Soft tissue / muscle","35 to 55"],["Acute blood","50 to 80"],["Contrast-filled artery","200 to 400+"],
    ["Calcification / bone","400 to 1000+"],["Metal","3000+"],
  ]}},
  {h:"Rules of thumb", list:[
    "Width = range of HU shown in grey. Level = HU at the middle of that range.",
    "Narrow width raises contrast between tissues with similar HU (brain, liver).",
    "Unenhanced adrenal nodule ≤10 HU is a lipid-rich adenoma. See the adrenal washout calculator under Reporting systems.",
  ]},
]},
{id:"ct-head", mod:"ct", title:"Non-contrast CT head", sum:"Trauma, stroke and acute headache. Fast, no prep.", tags:["Head","Non-contrast","Stroke"], secs:[
  {h:"Indications", list:["Head trauma, acute neurological deficit, suspected stroke (first study; add CTA ± perfusion per stroke pathway)","Thunderclap or worst headache, altered mental status, suspected hydrocephalus or shunt failure"]},
  {h:"Patient prep & positioning", list:["No preparation. Remove hairpins, earrings, dentures, glasses.","Supine, head in head holder, chin slightly tucked; immobilise gently if confused.","Scan baseline parallel to the orbitomeatal line (or angle to spare the lenses on axial scanning)."]},
  {h:"Technique", list:["Coverage: foramen magnum to vertex.","About <code>120 kVp</code>, dose-modulated mAs; check CTDIvol against your local reference level.","Reconstruct 4–5 mm axial for brain, thin (0.625–1.25 mm) bone algorithm, plus coronal and sagittal MPR."]},
  {h:"Review checklist", list:["Blood: extra-axial, parenchymal, intraventricular, subarachnoid (look at sylvian fissures, interpeduncular cistern, occipital horns).","Stroke signs: hyperdense vessel, loss of insular ribbon, gray–white blurring, ASPECTS.","Mass effect: midline shift, effaced sulci, basal cisterns, herniation.","Ventricles: size and hydrocephalus.","Bone window: fractures, sinuses and mastoids (fluid in trauma)."]},
]},
{id:"ct-ap", mod:"ct", title:"CT abdomen & pelvis with contrast", sum:"Routine portal venous phase study.", tags:["Abdomen","IV contrast","Portal venous"], secs:[
  {h:"Patient prep", list:["NPO for solids 2–4 hours (per local policy).","Oral contrast per protocol: positive oral contrast 60–90 min before, or water as neutral contrast.","Screen for prior contrast reaction, kidney function and metformin (see Contrast & safety).","20 G cannula, antecubital preferred."]},
  {h:"Technique", list:["IV contrast about 1–1.5 mL/kg (often 80–120 mL) of 300–370 mgI/mL at 2–3 mL/s.","Scan delay <code>65–70 s</code> (portal venous).","Coverage: diaphragm domes through the pubic symphysis.","Arms above head, breath-hold at end inspiration.","Reconstruct 2.5–5 mm axial plus coronal and sagittal MPR."]},
  {h:"Common add-on phases", list:["Late arterial (35–40 s): hypervascular liver lesions, pancreas.","Delayed (3–5 min): liver lesion washout, lesion characterisation.","Excretory (5–15 min): urothelium (CT urogram)."]},
]},
{id:"ct-phases", mod:"ct", title:"Contrast phase timing", sum:"When to scan after IV injection, and what each phase shows.", tags:["Timing","Multiphase"], secs:[
  {h:"Phases", table:{head:["Phase","Delay after injection","Best for"], rows:[
    ["Non-contrast","—","Calcification, blood, baseline HU, stones"],
    ["Early arterial / CTA","15–25 s or bolus tracking","Arteries: aorta, dissection, GI bleed source"],
    ["Late arterial","35–40 s","HCC and hypervascular metastases, pancreas"],
    ["Pancreatic","40–50 s","Pancreatic adenocarcinoma conspicuity"],
    ["Portal venous","60–70 s","Routine abdomen, hypovascular lesions"],
    ["Nephrographic","90–100 s","Renal masses"],
    ["Delayed","3–5 min","Washout, cholangiocarcinoma, fibrous lesions"],
    ["Adrenal washout","15 min","Adenoma characterisation"],
    ["Excretory","5–15 min","Collecting system, ureters, bladder"],
  ]}},
  {h:"Bolus tracking", list:["Place ROI on the target vessel (descending aorta for abdominal CTA, main pulmonary artery for CTPA).","Common trigger threshold 100–150 HU, then a short diagnostic delay.","Use a saline chaser to tighten the bolus and reduce streak artifact."]},
]},
{id:"ct-pe", mod:"ct", title:"CT pulmonary angiography", sum:"CTPA for suspected pulmonary embolism.", tags:["Chest","CTA","PE"], secs:[
  {h:"Patient prep", list:["18–20 G cannula, right antecubital preferred.","Coach the breath-hold: gentle inspiration, no deep breath or Valsalva."]},
  {h:"Technique", list:["50–80 mL of 350–370 mgI/mL at 4–5 mL/s, then 30–40 mL saline chaser.","Bolus track in the main pulmonary artery, trigger about 100 HU.","Scan caudocranial from the bases to the apices.","Reconstruct thin (≤1 mm) axial plus MIP and coronal MPR."]},
  {h:"Is the study diagnostic?", list:["Aim for ≥250 HU in the main pulmonary artery.","Transient interruption of contrast: unopacified IVC blood from a deep breath. Bright SVC with dim PA is the clue.","Check RV/LV ratio (>1.0 suggests right heart strain) and contrast reflux into the IVC and hepatic veins."]},
]},
{id:"ct-kub", mod:"ct", title:"CT KUB (renal stone protocol)", sum:"Low-dose non-contrast CT for flank pain.", tags:["Non-contrast","Low dose","Stones"], secs:[
  {h:"Technique", list:["No IV or oral contrast.","Low-dose protocol (reduced mAs; acceptable for stone detection).","Coverage: top of the kidneys to the bladder base.","Prone scanning separates a stone at the UVJ from one already in the bladder.","Thin axial plus coronal reconstructions."]},
  {h:"Reading tips", list:["Nearly all stones are dense on CT, including uric acid stones. Indinavir stones are the classic exception.","Soft-tissue rim sign: ureteral wall around a stone.","Comet-tail sign: tapering tissue behind a pelvic phlebolith.","Report stone size, location, hydronephrosis and perinephric stranding."]},
]},

/* ---------------- Mammography ---------------- */
{id:"mammo-views", mod:"mammo", title:"Standard views & positioning", sum:"CC and MLO technique, plus the supplemental views and when to use them.", tags:["CC","MLO","Positioning"], secs:[
  {h:"Before the exam", list:["No deodorant, antiperspirant, powder or lotion on the day. These mimic calcifications.","Ask about lumps, nipple discharge, implants, prior surgery or biopsy (use scar markers).","Premenopausal patients with tender breasts: schedule the week after menses.","Get prior studies for comparison."]},
  {h:"Craniocaudal (CC)", list:["Lift the breast to raise the inframammary fold, then set the detector height.","Nipple in profile, centred on the image.","Include all medial tissue and as much lateral tissue as possible.","Pectoral muscle is visible on about 30–40% of good CC views."]},
  {h:"Mediolateral oblique (MLO)", list:["Angle the C-arm 30–60° so the detector is parallel to the pectoral muscle (often about 45°).","Pectoral muscle wide at the axilla, convex anterior edge, reaching the level of the posterior nipple line.","Inframammary fold open, nipple in profile, no skin folds."]},
  {h:"Supplemental views", table:{head:["View","Use"], rows:[
    ["Spot compression","Confirm a real finding vs. summation; evaluate mass margins"],
    ["Magnification (1.5–2×)","Calcification morphology and distribution"],
    ["90° lateral (ML / LM)","Triangulate location; milk of calcium layering (teacup)"],
    ["XCCL (exaggerated CC lateral)","Far lateral and axillary tail tissue"],
    ["Cleavage (CV)","Far medial tissue"],
    ["Rolled (RL / RM)","Separate superimposed tissue"],
    ["Implant displacement (Eklund)","Displaced views with implants pushed back"],
    ["Tangential","Prove skin calcifications or palpable lump location"],
  ]}},
]},
{id:"mammo-quality", mod:"mammo", title:"Mammogram image quality checklist", sum:"Positioning, compression and labeling checks before you read.", tags:["QA","PNL"], secs:[
  {h:"Posterior nipple line (PNL) rule", list:["On the MLO, draw the PNL from the nipple perpendicular to the pectoral muscle edge.","On the CC, measure from the nipple to the pectoral muscle or the image edge.","The CC PNL should be within 1 cm of the MLO PNL. If shorter, posterior tissue is missing."]},
  {h:"Checklist", list:["Pectoral muscle down to the PNL on the MLO.","Inframammary fold visible and open.","Nipple in profile on at least one view.","No skin folds, no motion blur (look at fine linear structures and calcifications).","Adequate compression: tissue evenly spread, not overlapping.","Correct laterality and view labels, placed on the axillary side.","Symmetric hanging protocol: right and left back to back."]},
  {h:"Why compression matters", list:["Lowers breast thickness, so less dose and less scatter.","Reduces motion and overlap, sharper detail.","Brings structures closer to the detector, less geometric blur."]},
]},
{id:"birads", mod:"mammo", title:"BI-RADS assessment categories", sum:"Final assessment categories, likelihood of malignancy and management.", tags:["BI-RADS","ACR"], secs:[
  {h:"Categories", table:{head:["Category","Meaning","Malignancy likelihood","Management"], rows:[
    ["0","Incomplete","n/a","Recall for additional imaging or priors"],
    ["1","Negative","Essentially 0%","Routine screening"],
    ["2","Benign","Essentially 0%","Routine screening"],
    ["3","Probably benign","&gt;0% to ≤2%","Short-interval follow-up (usually 6 months) or surveillance"],
    ["4A","Low suspicion","&gt;2% to ≤10%","Tissue diagnosis"],
    ["4B","Moderate suspicion","&gt;10% to ≤50%","Tissue diagnosis"],
    ["4C","High suspicion","&gt;50% to &lt;95%","Tissue diagnosis"],
    ["5","Highly suggestive of malignancy","≥95%","Tissue diagnosis"],
    ["6","Known biopsy-proven malignancy","—","Surgical excision when clinically appropriate"],
  ]}},
  {h:"Notes", list:["Category 0 is for screening only, except rarely in diagnostic work (e.g. awaiting MRI).","Category 3 should come from a full diagnostic workup, not straight from screening.","After benign-concordant biopsy, return to routine screening or short follow-up per local policy."]},
]},
{id:"mammo-lexicon", mod:"mammo", title:"BI-RADS lexicon: density, masses, calcifications", sum:"Descriptor terms for the mammography report.", tags:["Lexicon","Calcifications","Density"], secs:[
  {h:"Breast composition", table:{head:["Category","Description"], rows:[
    ["a","Almost entirely fatty"],
    ["b","Scattered areas of fibroglandular density"],
    ["c","Heterogeneously dense, which may obscure small masses"],
    ["d","Extremely dense, which lowers sensitivity"],
  ]}},
  {h:"Density notification", note:"In the US, the FDA MQSA rule (effective September 2024) requires every mammography report and patient letter to state whether the breasts are dense.", tone:"info"},
  {h:"Masses", table:{head:["Feature","Terms (less to more suspicious)"], rows:[
    ["Shape","Oval, round, irregular"],
    ["Margin","Circumscribed, obscured, microlobulated, indistinct, spiculated"],
    ["Density","Fat-containing, low, equal, high"],
  ]}},
  {h:"Calcifications", table:{head:["Group","Terms"], rows:[
    ["Typically benign","Skin, vascular, coarse (popcorn), large rod-like, round, rim, dystrophic, milk of calcium, suture"],
    ["Suspicious morphology","Amorphous, coarse heterogeneous, fine pleomorphic, fine linear or fine-linear branching"],
    ["Distribution","Diffuse, regional, grouped, linear, segmental (linear and segmental raise suspicion)"],
  ]}},
  {h:"Other findings", list:["Architectural distortion","Asymmetry, global asymmetry, focal asymmetry, developing asymmetry","Intramammary lymph node, skin lesion, solitary dilated duct","Associated features: skin or nipple retraction, skin thickening, trabecular thickening, axillary adenopathy"]},
]},
{id:"mammo-workup", mod:"mammo", title:"Diagnostic workup after a recall", sum:"From screening callback to biopsy.", tags:["Workup","Biopsy"], secs:[
  {h:"Sequence", steps:["Screening recall: BI-RADS 0 with the finding and location described.","Diagnostic mammogram: spot compression for masses and asymmetries, magnification for calcifications, 90° lateral to triangulate.","Targeted ultrasound for masses, asymmetries and palpable areas.","Final assessment: BI-RADS 1 to 5.","Biopsy for 4 and 5: ultrasound-guided core, stereotactic, or MRI-guided. Place a clip and get a post-procedure mammogram.","Radiology–pathology concordance review. Discordant benign results need repeat sampling or excision."]},
]},

/* ---------------- MRI ---------------- */
{id:"mri-safety", mod:"mri", title:"MRI safety screening & zones", sum:"Who goes where, implant labels, and the screening questions.", tags:["Safety","Zones","Implants"], secs:[
  {h:"ACR safety zones", table:{head:["Zone","Area","Access"], rows:[
    ["I","Public areas outside the suite","Anyone"],
    ["II","Reception, screening, changing","Patients under supervision"],
    ["III","Control room and corridor to the magnet","Screened people with MR personnel only"],
    ["IV","Magnet room","Screened people under direct MR personnel supervision"],
  ]}},
  {h:"Device labels", table:{head:["Label","Meaning"], rows:[
    ["MR Safe (green square)","No known hazard in any MR environment"],
    ["MR Conditional (yellow triangle)","Safe only under stated conditions: field strength, SAR, gradient limits, scan region"],
    ["MR Unsafe (red circle)","Never enters Zone IV"],
  ]}},
  {h:"Screen every patient for", list:["Pacemaker, ICD or leads (many are MR Conditional; follow the device protocol).","Cochlear implant, neurostimulator, drug pump, programmable shunt.","Aneurysm clips, heart valves, stents, coils.","Metal fragments, especially in the eye (orbit radiograph if a metalworking history).","Medication patches with metal backing, tattoos, body piercings.","Pregnancy, claustrophobia, kidney function if gadolinium is planned."]},
  {h:"Hazards in the room", list:["Projectile effect from ferromagnetic objects.","RF burns: no skin-to-skin loops, pad the patient, no coiled cables.","Acoustic noise: hearing protection for every patient.","Quench: know the emergency procedure and the quench button."]},
]},
{id:"mri-sequences", mod:"mri", title:"MRI sequence cheat sheet", sum:"What looks bright on which sequence, and what each sequence is for.", tags:["T1","T2","DWI","FLAIR"], secs:[
  {h:"Sequences", table:{head:["Sequence","Fluid","Fat","Best for"], rows:[
    ["T1","Dark","Bright","Anatomy, fat, subacute blood, melanin, post-contrast"],
    ["T2","Bright","Bright (FSE)","Edema, cysts, most pathology"],
    ["FLAIR","Dark (suppressed)","Bright","Periventricular and cortical lesions, MS, SAH"],
    ["STIR / T2 fat-sat","Bright","Dark","Marrow edema, soft tissue inflammation"],
    ["DWI + ADC","—","—","Restricted diffusion: bright DWI with dark ADC. Acute infarct, abscess, cellular tumour"],
    ["SWI / GRE","—","—","Blooming from blood products, calcium, microbleeds"],
    ["T1 post-gadolinium (fat-sat)","Dark","Dark","Enhancement: tumour, infection, inflammation"],
    ["MRCP (heavy T2)","Very bright","Dark","Bile ducts and pancreatic duct"],
  ]}},
  {h:"Pitfalls", list:["T2 shine-through: bright DWI with bright ADC is not true restriction.","Fat-suppression failure near metal or at the neck and ankles: use STIR or Dixon.","Gadolinium shortens T1, so enhancing tissue is bright on T1."]},
]},
{id:"mri-brain", mod:"mri", title:"Routine brain MRI protocol", sum:"Core sequences and common add-ons.", tags:["Brain","Protocol"], secs:[
  {h:"Core protocol", list:["Sagittal T1","Axial T2","Axial FLAIR","Axial DWI with ADC map","Axial SWI or GRE","Coronal T2 or FLAIR","With contrast: 3D T1 post-gadolinium (reformat axial and coronal)"]},
  {h:"Add-ons by indication", table:{head:["Indication","Add"], rows:[
    ["Stroke / vessels","TOF MRA head, ± neck MRA; perfusion"],
    ["Tumour","Perfusion (DSC), spectroscopy, 3D post-contrast"],
    ["Hearing loss / vertigo","Thin heavily T2-weighted IAC sequence, thin post-contrast"],
    ["Pituitary","Thin coronal and sagittal T1, dynamic coronal post-contrast"],
    ["Epilepsy","Thin coronal T2 and FLAIR perpendicular to the hippocampus, 3D T1"],
    ["Multiple sclerosis","3D FLAIR, sagittal FLAIR, post-contrast T1"],
  ]}},
]},
{id:"mri-breast", mod:"mri", title:"Breast MRI", sum:"Scheduling, positioning, dynamic contrast and kinetic curves.", tags:["Breast","DCE","Kinetics"], secs:[
  {h:"Scheduling & prep", list:["Premenopausal: scan in the second week of the cycle (days 7–14) to reduce background enhancement.","Screen for gadolinium contraindications and MRI safety.","Implant rupture study: silicone-specific sequences, no contrast needed."]},
  {h:"Technique", list:["Prone in a dedicated breast coil, both breasts, arms up.","T2 (or STIR) and T1 non-fat-sat.","Dynamic: one pre-contrast and several post-contrast fat-sat T1 acquisitions, with subtractions.","Optional DWI."]},
  {h:"Kinetic curves (delayed phase)", table:{head:["Type","Shape","Suggests"], rows:[
    ["I","Persistent: keeps rising","Usually benign"],
    ["II","Plateau","Intermediate"],
    ["III","Washout","Suspicious for malignancy"],
  ]}},
  {h:"Background parenchymal enhancement", p:"Report as minimal, mild, moderate or marked."},
]},

/* ---------------- Ultrasound ---------------- */
{id:"us-prep", mod:"us", title:"Ultrasound patient prep", sum:"Fasting and bladder instructions by exam.", tags:["Prep","Scheduling"], secs:[
  {h:"By exam", table:{head:["Exam","Preparation"], rows:[
    ["Abdomen / RUQ / gallbladder","NPO 6–8 hours"],
    ["Aorta","NPO 6–8 hours to reduce bowel gas"],
    ["Renal artery Doppler","NPO about 8 hours"],
    ["Pelvis (transabdominal)","Full bladder: about 1 L of water finished 1 hour before, do not void"],
    ["Pelvis (transvaginal)","Empty bladder"],
    ["Kidneys / bladder","Well hydrated; full bladder for bladder views"],
    ["Early obstetric","Partly full bladder for transabdominal; empty for transvaginal"],
    ["Thyroid, breast, scrotum, soft tissue, vascular","No preparation"],
  ]}},
]},
{id:"us-knobology", mod:"us", title:"Transducers & knobology", sum:"Probe choice and the settings that fix most bad images.", tags:["Probes","Doppler"], secs:[
  {h:"Transducers", table:{head:["Probe","Frequency","Use"], rows:[
    ["Linear","7–18 MHz","Thyroid, breast, vessels, MSK, testes, superficial"],
    ["Curvilinear","2–6 MHz","Abdomen, pelvis, obstetrics"],
    ["Phased array","1–5 MHz","Cardiac, intercostal windows"],
    ["Endocavitary","5–9 MHz","Transvaginal, transrectal"],
  ]}},
  {h:"Image optimisation", list:["Depth: area of interest fills about two-thirds of the screen.","Focus at or just below the area of interest.","Overall gain plus TGC so the liver is even from top to bottom.","Tissue harmonics for difficult patients.","Higher frequency gives better resolution but less penetration."]},
  {h:"Doppler", list:["Keep the insonation angle ≤60° for velocity measurements.","Small colour box; steer it toward the flow.","Lower the scale (PRF) for slow flow; raise it to stop aliasing.","Spectral gate about two-thirds of the vessel width, in the centre."]},
]},
{id:"us-normals", mod:"us", title:"Common normal measurements", sum:"Adult normal values often used in reports.", tags:["Normals","Measurements"], secs:[
  {h:"Adult values (typical cut-offs)", table:{head:["Structure","Normal"], rows:[
    ["Common bile duct","≤6 mm (slightly larger with age and after cholecystectomy)"],
    ["Gallbladder wall","≤3 mm"],
    ["Portal vein diameter","&lt;13 mm"],
    ["Spleen length","≤12–13 cm"],
    ["Kidney length","10–12 cm"],
    ["Abdominal aorta","&lt;3.0 cm (≥3.0 cm is aneurysmal)"],
    ["Appendix","≤6 mm and compressible"],
    ["Endometrium, postmenopausal with bleeding","≤4 mm is reassuring"],
  ]}},
  {h:"Paediatric: pyloric stenosis", list:["Muscle wall thickness ≥3 mm","Channel length ≥15–17 mm"]},
  {h:"Caution", note:"Cut-offs differ between references and institutions. Add your department's values in the notes below.", tone:"info"},
]},

/* ---------------- X-ray ---------------- */
{id:"xr-chest", mod:"xr", title:"Chest X-ray (PA & lateral)", sum:"Positioning, film quality check and a review system.", tags:["Chest","RIPE","Lines & tubes"], secs:[
  {h:"PA positioning", list:["Erect, facing the detector, chin up, shoulders rolled forward to move the scapulae off the lungs.","Source-to-image distance 180 cm (72 in).","Full inspiration, central ray at about T7.","High kV technique, about 110–125 kVp."]},
  {h:"Lateral", list:["Left side against the detector (less cardiac magnification).","Arms raised above the head."]},
  {h:"Quality check: RIPE", table:{head:["","Check"], rows:[
    ["Rotation","Spinous processes midway between the medial clavicle ends"],
    ["Inspiration","About 6 anterior or 9–10 posterior ribs above the diaphragm"],
    ["Projection","PA or AP? AP magnifies the heart, so cardiothoracic ratio is unreliable"],
    ["Exposure","Vertebral bodies just visible behind the heart"],
  ]}},
  {h:"Lines and tubes", list:["Endotracheal tube: tip about 5 cm (±2 cm) above the carina with the head neutral.","Nasogastric tube: tip below the diaphragm in the stomach, side hole past the GE junction.","Central venous catheter: tip at the lower SVC or cavoatrial junction."]},
]},
{id:"xr-projections", mod:"xr", title:"Standard radiograph projections", sum:"Routine views by body part.", tags:["MSK","Projections"], secs:[
  {h:"Routine series", table:{head:["Body part","Views"], rows:[
    ["Hand","PA, oblique, lateral"],
    ["Wrist","PA, lateral, oblique; add scaphoid (ulnar deviation) view if scaphoid injury"],
    ["Elbow","AP, lateral (look for fat pads)"],
    ["Shoulder","AP (internal/external rotation), axillary or Y view"],
    ["Cervical spine","AP, lateral (C7–T1 visible), open-mouth odontoid"],
    ["Lumbar spine","AP, lateral"],
    ["Pelvis / hip","AP pelvis, lateral hip (cross-table or frog-leg)"],
    ["Knee","AP, lateral; skyline for patellofemoral joint"],
    ["Ankle","AP, mortise, lateral"],
    ["Foot","AP, oblique, lateral"],
  ]}},
  {h:"Rule of two", list:["Two views at 90° to each other.","Two joints for long bones.","Comparison with the other side in children when unsure."]},
]},

/* ---------------- Fluoroscopy ---------------- */
{id:"fluoro-studies", mod:"fluoro", title:"Common fluoroscopy studies", sum:"Prep, contrast choice and key points.", tags:["GI","HSG","VCUG"], secs:[
  {h:"Studies", table:{head:["Study","Prep","Contrast","Notes"], rows:[
    ["Barium swallow / esophagram","NPO 2–4 h (or from midnight)","Thin and thick barium; tablet","Water-soluble first if leak or perforation suspected"],
    ["Upper GI","NPO from midnight","Effervescent + high-density barium, then single contrast","Double contrast for mucosa"],
    ["Small bowel follow-through","NPO from midnight","Barium","Serial images until contrast reaches the terminal ileum"],
    ["Contrast enema","Bowel prep for double contrast","Barium or water-soluble","Water-soluble if perforation or obstruction risk"],
    ["Hysterosalpingogram (HSG)","Days 7–10 of cycle, after bleeding stops","Iodinated (water- or oil-based)","Exclude pregnancy and active infection; NSAID beforehand"],
    ["VCUG","None","Iodinated, via bladder catheter","Image during voiding, including urethra; grade reflux I–V"],
  ]}},

{id:"fluoro-dose", mod:"fluoro", title:"Fluoroscopy dose reduction", sum:"Habits that cut patient and staff dose.", tags:["Radiation","ALARA"], secs:[

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip = s => String(s).replace(/<[^>]+>/g," ").replace(/&[a-z]+;/g," ");
function textOf(t){
  const parts=[t.title,t.sum,(t.tags||[]).join(" "),MOD_NAME[t.mod]||""];
  (t.secs||[]).forEach(s=>{parts.push(s.h,s.p||"",s.note||"");(s.list||[]).forEach(x=>parts.push(x));(s.steps||[]).forEach(x=>parts.push(x));
    if(s.table){parts.push(s.table.head.join(" "));s.table.rows.forEach(r=>parts.push(r.join(" ")))}});
  if(t.body) parts.push(t.body);
  return strip(parts.join(" ")).toLowerCase();
}

/* ---------- diagrams ---------- */
// Inline SVG figures, themed through the CSS tokens. Each one is spliced into its topic as a {h, fig, cap} section.
const tx=(x,y,s,o={})=>`<text x="${x}" y="${y}"${o.a?` text-anchor="${o.a}"`:""}${o.c?` class="${o.c}"`:""}${o.s?` font-size="${o.s}"`:""}${o.w?` font-weight="${o.w}"`:""}${o.f?` style="fill:${o.f}"`:""}>${s}</text>`;
const svg=(w,h,label,body)=>`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${body}</svg>`;

function ladder(items,{W=640,label="",groups=[],iconH=0}={}){
  const n=items.length,gap=6,bw=(W-gap*(n-1))/n,lines=Math.max(...items.map(it=>[it.a,it.b,it.c].filter(Boolean).length));
  const bh=iconH+42+lines*21,gh=groups.length?44:0;
  let b="";
  items.forEach((it,i)=>{
    const x=i*(bw+gap),cx=x+bw/2,inv=it.tone==="hot"?"inv":"";
    b+=`<rect x="${x}" y="0" width="${bw}" height="${bh}" rx="6" class="t-${it.tone||"mid"}"/>`;
    if(it.icon) b+=it.icon(cx,iconH/2+8);
    b+=tx(cx,iconH+30,it.k,{a:"middle",s:18,w:600,c:inv});
    let y=iconH+52;
    if(it.a){ b+=tx(cx,y,it.a,{a:"middle",c:inv}); y+=21; }
    if(it.b){ b+=tx(cx,y,it.b,{a:"middle",c:inv||"mu"}); y+=21; }
    if(it.c){ b+=tx(cx,y,it.c,{a:"middle",w:600,c:inv}); }
  });
  groups.forEach(g=>{
    const x1=g.from*(bw+gap)+4,x2=(g.to+1)*(bw+gap)-gap-4,y=bh+12;
    b+=`<path d="M${x1} ${y-6}V${y}H${x2}V${y-6}" class="s-mu" fill="none"/>`+tx((x1+x2)/2,y+20,g.label,{a:"middle",c:"mu"});
  });
  return svg(W,bh+gh,label,b);
}

function figPhases(){
  const x0=160,W=460,sx=t=>x0+(t<=120?t/120*W*.55:W*.55+(t-120)/780*W*.45);
  const rows=[["Early arterial / CTA",15,25],["Late arterial",35,40],["Pancreatic",40,50],["Portal venous",60,70,1],["Nephrographic",90,100],["Delayed",180,300],["Excretory",300,900],["Adrenal washout",900,900]];
  let b="";
  rows.forEach(([n,a,z,hi],i)=>{
    const y=10+i*28,x=sx(a),w=Math.max(sx(z)-x,6);
    b+=`<line x1="${x0}" y1="${y+9}" x2="${x0+W}" y2="${y+9}" class="s-ln" stroke-dasharray="2 4"/>`;
    b+=tx(x0-12,y+14,n,{a:"end",w:hi?600:0})+`<rect x="${Math.min(x,x0+W-6)}" y="${y}" width="${w}" height="18" rx="4" class="${hi?"f-ac":"t-acs"}"/>`;
  });
  const ay=10+rows.length*28+6;
  b+=`<line x1="${x0}" y1="${ay}" x2="${x0+W}" y2="${ay}" class="s-mu"/>`;
  [[0,"0"],[30,"30 s"],[60,"60 s"],[90,"90 s"],[120,"2 min"],[300,"5"],[600,"10"],[900,"15 min"]].forEach(([t,l],i,a)=>{
    const x=sx(t); b+=`<line x1="${x}" y1="${ay}" x2="${x}" y2="${ay+5}" class="s-mu"/>`+tx(x,ay+20,l,{a:i===0?"start":i===a.length-1?"end":"middle",c:"mu",s:12});
  });
  const bx=sx(120);
  b+=`<path d="M${bx+4} ${ay-6}l-6 12M${bx+10} ${ay-6}l-6 12" class="s-mu"/>`;
  return svg(640,ay+30,"Timeline of CT contrast phases after injection",b);
}

  let b=tx(190+95,20,"Fluid (CSF, bile, cysts)",{a:"middle",c:"mu",w:600})+tx(400+95,20,"Fat",{a:"middle",c:"mu",w:600});
  rows.forEach(([n,c1,l1,c2,l2],i)=>{

// Numbered step cards for workflows. it.n overrides the number, it.icon replaces the badge, tone "hot" inverts the text.
function cards(items,{cols=3,W=640,label=""}={}){
  const gap=22,rg=16,bw=(W-gap*(cols-1))/cols,lines=Math.max(...items.map(it=>(it.d||[]).length)),bh=46+lines*18;
  const rows=Math.ceil(items.length/cols); let b="";
  items.forEach((it,i)=>{
    const r=Math.floor(i/cols),c=i%cols,x=c*(bw+gap),y=r*(bh+rg),inv=it.tone==="hot"?"inv":"";
    b+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="8" class="t-${it.tone||"mid"}"/>`;
    if(it.icon) b+=it.icon(x+20,y+22);

    b+=tx(x+38,y+27,it.t,{w:600,c:inv});
    (it.d||[]).forEach((l,j)=>{ b+=tx(x+14,y+50+j*18,l,{c:inv||"mu",s:12.5}); });
    if(c<cols-1 && i<items.length-1) b+=`<path d="M${x+bw+7} ${y+bh/2-5}l6 5-6 5" class="s-ac" fill="none" stroke-width="2"/>`;
  });
  return svg(W,rows*bh+(rows-1)*rg,label,b);
}

  let b=tx(0,16,"Contrast-associated AKI risk",{c:"mu",w:600});
  b+=seg(24,0,30,"hot","Higher risk: IV saline")+seg(24,30,45,"warn","Very low")+seg(24,45,90,"ok","Negligible risk");
  b+=tx(0,84,"Metformin",{c:"mu",w:600});
  b+=seg(92,0,30,"warn","Hold for 48 h")+seg(92,30,90,"ok","No need to stop");
  [0,30,45,60,90].forEach((v,i,a)=>{ b+=`<line x1="${sx(v)}" y1="126" x2="${sx(v)}" y2="132" class="s-mu"/>`+tx(sx(v),148,v===90?"90+":v,{a:i===0?"start":i===a.length-1?"end":"middle",c:"mu",s:12}); });

}

/* Notes: links become clickable, YouTube links become players, image links become pictures. */
function notesBodyHTML(text){
  const re=/https?:\/\/[^\s<>"']+/g, media=[];
  let out="",last=0,m;
  while((m=re.exec(text))){
    const url=m[0].replace(/[.,;:)]+$/,"");
    out+=esc(text.slice(last,m.index))+`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a>`;
    last=m.index+url.length;
    const yt=url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/);
    if(yt) media.push(`<figure><iframe src="https://www.youtube-nocookie.com/embed/${yt[1]}" title="Video" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><figcaption><a href="https://www.youtube.com/watch?v=${yt[1]}" target="_blank" rel="noopener">Open on YouTube</a></figcaption></figure>`);
    else if(/\.(png|jpe?g|gif|webp|svg)(\?|#|$)/i.test(url)) media.push(`<figure><a href="${esc(url)}" target="_blank" rel="noopener"><img src="${esc(url)}" alt="" loading="lazy"></a></figure>`);
  }
  out+=esc(text.slice(last));
  return `<div class="body">${out}</div>`+(media.length?`<div class="media">${media.join("")}</div>`:"");
}

function secHTML(s){
  let b="";
  if(s.hu) b=huHTML();
  else if(s.calc==="tirads") b=tiradsHTML();
  else if(s.calc==="adrenal") b=adrenalHTML();
  else if(s.table) b=`<div class="tbl"><table><thead><tr>${s.table.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${s.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  else if(s.list) b=`<ul>${s.list.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  else if(s.steps) b=`<ol>${s.steps.map(x=>`<li>${x}</li>`).join("")}</ol>`;
  else if(s.note) b=`<div class="callout ${s.tone==="info"?"info":""}">${s.note}</div>`;
  else if(s.p) b=`<p>${s.p}</p>`;
  else if(s.fig) b=`<figure class="fig">${s.fig()}${s.cap?`<figcaption>${s.cap}</figcaption>`:""}</figure>`;
  return `<section class="sec"><h2>${s.h}</h2>${b}</section>`;
}
function bodyHTML(text){
  const lines=String(text||"").split(/\r?\n/); let out="",list=false,para=[];
  const flushP=()=>{ if(para.length){ out+=`<p>${para.join("<br>")}</p>`; para=[]; } };
  const flushL=()=>{ if(list){ out+="</ul>"; list=false; } };
  lines.forEach(l=>{
    const t=l.trim();
    if(!t){ flushP(); flushL(); return; }
    if(t.startsWith("## ")){ flushP(); flushL(); out+=`<h3>${esc(t.slice(3))}</h3>`; return; }
    if(/^[-*•]\s+/.test(t)){ flushP(); if(!list){ out+="<ul>"; list=true; } out+=`<li>${esc(t.replace(/^[-*•]\s+/,""))}</li>`; return; }
    flushL(); para.push(esc(t));
  });
  flushP(); flushL(); return out;
}

  }
  let html=`<article class="topic"><div><button class="btn ghost" type="button" data-back>← All topics</button></div>
    <header><p class="eyebrow">${esc(MOD_NAME[t.mod])}${t.custom?" · My protocol":""}</p><h1>${esc(t.title)}</h1></header>`;
  if(t.sum) html+=`<p class="lede">${esc(t.sum)}</p>`;

async function saveNotes(){
  const text=$("#notes-text").value.trim(), msg=$("#notes-msg"), btn=document.querySelector("[data-notes-save]");
  btn.disabled=true; msg.className="msg"; msg.textContent="Saving…";
  try{
    const ref=live.db.doc("notes/"+state.topic);
    if(text) await ref.set({text, updatedAt:new Date().toISOString()});
    else await ref.delete();
    live.notes[state.topic]= text?{text,updatedAt:new Date().toISOString()}:undefined;
    live.notesEditing=false; renderNotes();
  }catch(e){ btn.disabled=false; msg.textContent=dbErr(e); }
}
function dbErr(e){
  if(e?.code==="invalid_argument"){ live.canWrite=false; live.status="readonly"; renderRail(); return "You can read these notes but not change them. Ask the page owner for edit access."; }
  if(e?.code==="quota_exceeded") return "Storage is full. Delete some old protocols, then save again.";
  if(e?.code==="resource_exhausted") return "Too many saves at once. Wait a few seconds and save again.";
  return "Couldn't save. Check your connection and try again.";
}

      <div class="field"><label for="p-sum">One-line summary</label><input id="p-sum" type="text" maxlength="200" value="${esc(c?.summary||"")}" placeholder="Shown on the topic card"></div>
    </div>
    <div class="field"><label for="p-body">Protocol</label><textarea id="p-body" placeholder="## Patient prep&#10;- NPO 4 hours&#10;- 20 G antecubital&#10;&#10;## Technique&#10;- 100 mL Omnipaque 350 at 4 mL/s&#10;- Arterial: bolus track aorta 150 HU + 18 s">${esc(c?.body||"")}</textarea>
    <p class="hint">Start a line with “## ” for a heading and “- ” for a bullet.</p></div>
    <div class="row"><button class="btn primary" type="submit">Save protocol</button><button class="btn" type="button" data-cancel-edit>Cancel</button><span class="msg" id="p-msg" role="status"></span></div>
  </form>`;
  $("#p-title").focus();
  $("#proto-form").addEventListener("submit",async ev=>{
    ev.preventDefault();
    const data={title:$("#p-title").value.trim(), mod:$("#p-mod").value, summary:$("#p-sum").value.trim(), body:$("#p-body").value, updatedAt:new Date().toISOString()};
    const msg=$("#p-msg"); if(!data.title){ msg.textContent="Add a title to save."; return; }
    msg.className="msg"; msg.textContent="Saving…";
    try{
      let id=c?.id;
      if(id) await live.db.doc("custom/"+id).set(data);
      else { const ref=await live.db.collection("custom").add(data); id=ref.id; }
      const i=live.custom.findIndex(x=>x.id===id); const rec={id,...data};
      if(i>=0) live.custom[i]=rec; else live.custom.push(rec);
      state.editing=null; go("my-"+id);
    }catch(e){ msg.textContent=dbErr(e); }
  });
}

/* ---------- HU scale ---------- */
function huHTML(){
  const pct=hu=>((Math.max(-1000,Math.min(1000,hu))+1000)/20).toFixed(1)+"%";
  const win=(name,w,l)=>{const a=pct(l-w/2),b=pct(l+w/2);return `<div class="hu-row"><span>${name} <code>W${w} / L${String(l).replace("-","−")}</code></span><div class="track"><div class="win" style="--a:${a};--b:${b}"></div></div></div>`};
  const mark=(label,hu)=>`<span style="left:${pct(hu)}">${label}</span>`;
  return `<div class="hu" role="img" aria-label="Hounsfield scale from minus 1000 to plus 1000 with lung, soft tissue and bone windows marked">
    ${win("Lung",1500,-600)}${win("Soft tissue",400,40)}${win("Bone",1800,400)}
    <div class="hu-row"><span></span><div class="bar"></div></div>
    <div class="hu-row"><span></span><div class="ticks"><span style="left:0">−1000</span><span style="left:25%">−500</span><span style="left:50%">0</span><span style="left:75%">+500</span><span style="left:100%">+1000</span></div></div>
    <div class="hu-row"><span></span><div class="marks">${mark("Air",-950)}${mark("Fat",-100)}${mark("Bone",700)}</div></div>
    <div class="hu-row"><span></span><div class="marks">${mark("Lung",-700)}${mark("Water",0)}</div></div>
  </div>`;
}

/* ---------- TI-RADS ---------- */
function tiradsHTML(){
  const sel=(id,label,opts)=>`<div class="field"><label for="${id}">${label}</label><select id="${id}">${opts.map(([v,t])=>`<option value="${v}">${t}</option>`).join("")}</select></div>`;
  return `<div class="calc">
    <div class="fields">
      ${sel("tr-comp","Composition",[[0,"Cystic or almost completely cystic (0)"],[0,"Spongiform (0)"],[1,"Mixed cystic and solid (1)"],[2,"Solid or almost completely solid (2)"]])}
      ${sel("tr-echo","Echogenicity",[[0,"Anechoic (0)"],[1,"Hyperechoic or isoechoic (1)"],[2,"Hypoechoic (2)"],[3,"Very hypoechoic (3)"]])}
      ${sel("tr-shape","Shape",[[0,"Wider-than-tall (0)"],[3,"Taller-than-wide (3)"]])}
      ${sel("tr-margin","Margin",[[0,"Smooth (0)"],[0,"Ill-defined (0)"],[2,"Lobulated or irregular (2)"],[3,"Extrathyroidal extension (3)"]])}
      <fieldset class="field"><legend>Echogenic foci (add all that apply)</legend>
        <label><input type="checkbox" id="tr-f1" value="1"> Macrocalcifications (1)</label>
        <label><input type="checkbox" id="tr-f2" value="2"> Peripheral or rim calcifications (2)</label>
        <label><input type="checkbox" id="tr-f3" value="3"> Punctate echogenic foci (3)</label>
      </fieldset>
      <div class="field"><label for="tr-size">Maximum diameter (cm)</label><input id="tr-size" type="number" min="0" step="0.1" inputmode="decimal" value="1.6"></div>
    </div>
    <div class="result" id="tr-out" aria-live="polite"></div>
  </div>`;
}
function bindTirads(){
  const ids=["tr-comp","tr-echo","tr-shape","tr-margin","tr-f1","tr-f2","tr-f3","tr-size"];
  // sensible example so the calculator opens in a worked state
  $("#tr-comp").selectedIndex=3; $("#tr-echo").selectedIndex=2;
  const calc=()=>{
    let pts=+$("#tr-comp").value + +$("#tr-echo").value + +$("#tr-shape").value + +$("#tr-margin").value;
    ["tr-f1","tr-f2","tr-f3"].forEach(i=>{ if($("#"+i).checked) pts+=+$("#"+i).value; });
    const lvl=pts<=1?1:pts===2?2:pts===3?3:pts<=6?4:5;
    const th={3:[2.5,1.5],4:[1.5,1.0],5:[1.0,0.5]}[lvl];
    const size=parseFloat($("#tr-size").value);
    let rec;
    if(!th) rec="No FNA, no follow-up.";
    else if(isNaN(size)) rec=`FNA if ≥${th[0]} cm; follow-up if ≥${th[1]} cm.`;
    else if(size>=th[0]) rec=`FNA recommended (≥${th[0]} cm).`;
    else if(size>=th[1]) rec=`Ultrasound follow-up (≥${th[1]} cm, below FNA threshold of ${th[0]} cm).`;
    else rec=`No FNA or follow-up needed at this size (below ${th[1]} cm).`;
    const names=["","Benign","Not suspicious","Mildly suspicious","Moderately suspicious","Highly suspicious"];
    $("#tr-out").innerHTML=`<span class="big">TR${lvl}</span><span>${pts} point${pts===1?"":"s"} · ${names[lvl]}</span><p>${rec}</p>`;
  };
  ids.forEach(i=>$("#"+i).addEventListener("input",calc)); calc();
}

/* ---------- Adrenal ---------- */
function adrenalHTML(){
  const f=(id,l,v)=>`<div class="field"><label for="${id}">${l}</label><input id="${id}" type="number" step="1" inputmode="numeric" value="${v}"></div>`;
  return `<div class="calc"><div class="fields">${f("ad-u","Unenhanced (HU)",28)}${f("ad-e","Portal venous (HU)",95)}${f("ad-d","15-min delayed (HU)",40)}</div><div class="result" id="ad-out" aria-live="polite"></div></div>`;
}
function bindAdrenal(){
  const calc=()=>{
    const u=parseFloat($("#ad-u").value), e=parseFloat($("#ad-e").value), d=parseFloat($("#ad-d").value);
    let out="";
    if(!isNaN(u) && u<=10){ out=`<span class="big">≤10 HU</span><p>Lipid-rich adenoma. No washout study needed.</p>`; }
    else if(isNaN(e)||isNaN(d)){ out=`<p>Enter the enhanced and delayed values.</p>`; }
    else{
      const apw=(!isNaN(u)&&e>u)?(e-d)/(e-u)*100:null, rpw=e>0?(e-d)/e*100:null;
      const adenoma=(apw!==null&&apw>=60)||(rpw!==null&&rpw>=40);
      out=`<span class="big">${apw===null?"—":apw.toFixed(0)+"%"}</span><span>absolute washout</span><span class="big">${rpw===null?"—":rpw.toFixed(0)+"%"}</span><span>relative washout</span>
        <p>${adenoma?"Consistent with adenoma (APW ≥60% or RPW ≥40%).":"Indeterminate washout. Consider prior imaging, chemical-shift MRI or further workup."}</p>`;
    }
    $("#ad-out").innerHTML=out;
  };
  ["ad-u","ad-e","ad-d"].forEach(i=>$("#"+i).addEventListener("input",calc)); calc();
}

/* ---------- routing ---------- */
function go(id){ if(location.hash.slice(1)===id) route(); else location.hash=id; }
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  live.notesEditing=false;
  if(state.editing){ state.view="edit"; }
  else if(h && h!=="home"){ state.view="topic"; state.topic=h; }
  else { state.view="list"; state.topic=null; }
  render(); window.scrollTo(0,0);
}
function render(){
  renderRail();
  if(state.view==="edit") renderEditor();
  else if(state.view==="topic") renderTopic();
  else renderList();
}
function setMod(id){
  state.mod=id; try{ localStorage.setItem("rrh-mod",id); }catch(e){}
  state.editing=null;
  if(location.hash && location.hash!=="#home") location.hash="home"; else route();
}

document.addEventListener("click",async ev=>{
  const el=ev.target.closest("button"); if(!el) return;
  if(el.dataset.mod){ setMod(el.dataset.mod); return; }
  if(el.dataset.open){ go(el.dataset.open); return; }
  if(el.id==="home"){ state.q=""; $("#q").value=""; setMod("all"); return; }
  if(el.hasAttribute("data-back")){ state.editing=null; location.hash="home"; return; }
  if(el.hasAttribute("data-clear")){ state.q=""; $("#q").value=""; render(); return; }
  if(el.hasAttribute("data-add")||el.id==="add-side"){ state.editing="new"; state.view="edit"; render(); window.scrollTo(0,0); return; }
  if(el.dataset.edit){ state.editing=el.dataset.edit; state.view="edit"; render(); return; }
  if(el.hasAttribute("data-cancel-edit")){ const back=state.editing!=="new"?"my-"+state.editing:null; state.editing=null; if(back) go(back); else { location.hash="home"; route(); } return; }
  if(el.hasAttribute("data-notes-edit")){ openNotesEditor(); return; }
  if(el.hasAttribute("data-notes-cancel")){ live.notesEditing=false; renderNotes(); return; }
  if(el.hasAttribute("data-notes-save")){ saveNotes(); return; }
  if(el.hasAttribute("data-del-ask")){
    $("#del-wrap").innerHTML=`<span class="row"><span>Delete this protocol?</span><button class="btn danger" type="button" data-del-yes>Delete</button><button class="btn" type="button" data-del-no>Keep</button></span>`; return;
  }
  if(el.hasAttribute("data-del-no")){ renderTopic(); return; }
  if(el.hasAttribute("data-del-yes")){
    const t=findTopic(state.topic); if(!t) return;
    try{ await live.db.doc("custom/"+t.docId).delete(); live.custom=live.custom.filter(c=>c.id!==t.docId); state.mod="mine"; location.hash="home"; }
    catch(e){ $("#del-wrap").innerHTML=`<span class="msg">${esc(dbErr(e))}</span>`; }
  }
});
let qTimer;
$("#q").addEventListener("input",e=>{
  clearTimeout(qTimer);
  qTimer=setTimeout(()=>{ state.q=e.target.value; if(state.view!=="list"){ state.editing=null; location.hash="home"; } else render(); },120);
});
document.addEventListener("keydown",e=>{
  if(e.key==="/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); $("#q").focus(); }
  if(e.key==="Escape" && document.activeElement===$("#q") && $("#q").value){ $("#q").value=""; state.q=""; render(); }
});
window.addEventListener("hashchange",route);
route();

/* ---------- live notes ---------- */
function onLive(){
  renderRail();
  if(state.view==="list") renderList();
  else if(state.view==="topic"){
    const t=findTopic(state.topic);
    if(!t || t.custom){ if(!document.querySelector("[data-del-yes]")) renderTopic(); }
    else renderNotes();
  }
}
/* Notes and custom protocols live in this browser's localStorage, behind the same small API the page uses. */
const STORE="rrh-data-v1";
function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE))||{notes:{},custom:{}}; }catch(e){ return {notes:{},custom:{}}; } }
function saveStore(s){ try{ localStorage.setItem(STORE,JSON.stringify(s)); }catch(e){ throw {code:"quota_exceeded"}; } }
function syncLive(){ const s=loadStore(); live.notes=s.notes||{}; live.custom=Object.entries(s.custom||{}).map(([id,v])=>({id,...v})); }
live.db={
  doc(path){ const [col,id]=path.split("/"); return {
    async set(data){ const s=loadStore(); (s[col]=s[col]||{})[id]=data; saveStore(s); syncLive(); },
    async delete(){ const s=loadStore(); if(s[col]) delete s[col][id]; saveStore(s); syncLive(); },
  }; },
  collection(col){ return { async add(data){ const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6); await live.db.doc(col+"/"+id).set(data); return {id}; } }; },
};
try{ localStorage.setItem("rrh-probe","1"); localStorage.removeItem("rrh-probe"); live.status="on"; }
catch(e){ live.db=null; live.status="off"; }
if(live.db) syncLive();
onLive();
window.addEventListener("storage",e=>{ if(e.key===STORE){ syncLive(); onLive(); } });

$("#backup").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(loadStore(),null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="reading-room-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
$("#restore").addEventListener("click",()=>$("#restore-file").click());
$("#restore-file").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const data=JSON.parse(await f.text());
    const s=loadStore();
    Object.assign(s.notes,data.notes||{}); Object.assign(s.custom,data.custom||{});
    saveStore(s); syncLive(); onLive();
  }catch(err){ const sp=$("#sync span"); if(sp) sp.textContent="That file is not a Reading Room backup."; }
  e.target.value="";
});

</script>
